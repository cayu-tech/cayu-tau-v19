[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cayu-tau3-banking"
version = "0.1.0"
description = "Reproducible Cayu agent integration for the tau3 banking benchmark."
requires-python = ">=3.12,<3.14"
dependencies = [
  "audioop-lts>=0.2.2; python_version >= '3.13'",
  "cayu @ git+file:///Users/talgatt/Desktop/Projects/cayu-tau-performance-20260927@d8e530acafa3cb7ab9596340182cffc8d9467d5d",
  # Cayu's browser-profile public import currently requires this optional dependency.
  "cryptography>=42",
  "jsonschema>=4.23",
  "rank-bm25>=0.2.2,<0.3",
  "referencing>=0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
cayu-tau3-banking = "cayu_tau3_banking.cli:main"
cayu-tau3-analyze-results = "cayu_tau3_banking.failure_analysis:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cayu_tau3_banking"]
